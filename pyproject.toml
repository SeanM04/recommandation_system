[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-dynamic-recommender"
version = "0.1.0"
description = "Real-time dynamic offer recommender (multi-armed bandits) for a telco/fintech super-app."
authors = [{ name = "Sean Mukariri" }]
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_docs.py" = ["E501"]  # HTML and SVG literals read better unbroken

[tool.mypy]
# Type-check the package. Third-party libraries without type hints count as Any.
files = ["src/recommender"]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]  # Pydantic models: optional fields stay optional
