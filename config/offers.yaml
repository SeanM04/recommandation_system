# Offer catalogue for a VodaPay-style telco / fintech super-app (South Africa).
#
# price_zar          what the customer pays (for cover products: the monthly premium;
#                    for the savings pocket: the minimum opening deposit)
# margin_zar         expected contribution per take-up, used by the revenue-aware reward
# eligible_segments  business guardrail: an offer is never shown outside these segments
#
# Prices and margins are illustrative, not quotes from any real provider.

offers:
