# Recommender settings. Every random draw is driven by `seed`, so runs are reproducible.
# The simulated world (population, hidden ground truth, calendar) is configured
# separately in simulation.yaml, which the recommender never reads.
seed: 42

# Relative paths are resolved against the project root.
paths:
  offers: config/offers.yaml
  customers: data/customers.csv
  database: data/recommender.db
